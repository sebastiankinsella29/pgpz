<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#160b14">
	<meta name="description" content="Password-protected seven-level puzzle.">
	<title>ARG Access</title>
	<link rel="stylesheet" href="style.css">
	<script src="main.js" defer></script>
</head>
<body>
	<main class="portal">
		<section class="entry" id="entry-view" aria-labelledby="entry-title">
			<div class="entry__copy">
				<h1 id="entry-title">Enter password</h1>
				<form class="access-form" id="entry-form">
					<label for="entry-password">Password</label>
					<div class="input-row"><input id="entry-password" name="password" type="text" autocomplete="off" required><button type="submit"><span>Enter</span></button></div>
					<p class="form-message" id="entry-message" role="alert" aria-live="polite"></p>
				</form>
			</div>
		</section>

		<section class="level-view is-hidden" id="level-view" aria-labelledby="level-title" aria-hidden="true">
			<div class="level-heading">
				<div><h1 id="level-title">Level 01</h1></div>
			</div>
			<div class="progress-row" aria-label="Level progress"><div class="progress-track"><span id="progress-fill"></span></div><strong id="progress-label">01 / 07</strong></div>
			<div class="level-content">
				<a class="current-doc" id="current-doc-link" href="#" target="_blank" rel="noopener noreferrer">Open level document</a>
				<form class="answer-form" id="answer-form">
					<label for="level-answer">Answer</label>
					<div class="input-row"><input id="level-answer" name="answer" type="text" autocomplete="off" required><button type="submit"><span>Submit</span></button></div>
					<p class="form-message" id="answer-message" role="alert" aria-live="polite"></p>
					<button class="hint-button" id="hint-button" type="button">Show hint</button>
					<p class="hint-message is-hidden" id="hint-message" role="status" aria-live="polite"></p>
				</form>
				<section class="success-panel is-hidden" id="success-panel" aria-live="polite">
					<div><h2 id="success-title" tabindex="-1">Congratulations</h2><p id="success-copy"></p></div>
					<a class="next-button is-hidden" id="next-button" href="#" target="_blank" rel="noopener noreferrer">Continue</a>
				</section>
			</div>
		</section>
	</main>
	<canvas id="confetti" aria-hidden="true"></canvas>
</body>
</html>
